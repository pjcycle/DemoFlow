name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear description of the bug.

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug
      placeholder: |
        1. Open DemoFlow
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      options:
        - macOS 14.x (Sonoma)
        - macOS 15.x (Sequoia)
        - macOS 26.x (latest)
    validations:
      required: true

  - type: input
    id: demoflow-version
    attributes:
      label: DemoFlow Version
      description: Version number or build
      placeholder: e.g. 1.0.0 or latest CI build

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, logs, or other relevant information
      placeholder: Attach screenshots or paste relevant log output here