name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Release
        run: |
          xcodebuild archive \
            -project DemoFlow.xcodeproj \
            -scheme DemoFlow \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ${{ github.workspace }}/Build/DemoFlow.xcarchive \
            -derivedDataPath ${{ github.workspace }}/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            INCLUDE_YT_DLP=YES

      - name: Verify Release App
        run: |
          app_path="${{ github.workspace }}/Build/DemoFlow.xcarchive/Products/Applications/DemoFlow.app"
          ytdlp_path="${app_path}/Contents/Helpers/yt-dlp"

          test -d "$app_path" || {
            echo "Release archive missing app bundle at: $app_path" >&2
            exit 1
          }

          test -f "$ytdlp_path" || {
            echo "Release archive missing yt-dlp helper at: $ytdlp_path" >&2
            exit 1
          }

      - name: Create DMG
        run: |
          brew install create-dmg
          app_path="${{ github.workspace }}/Build/DemoFlow.xcarchive/Products/Applications/DemoFlow.app"
          dmg_stage_dir="${{ github.workspace }}/Build/dmg-stage"

          rm -rf "$dmg_stage_dir"
          mkdir -p "$dmg_stage_dir"
          ditto "$app_path" "$dmg_stage_dir/DemoFlow.app"

          create-dmg \
            --volname "DemoFlow" \
            --window-pos 200 200 \
            --window-size 600 400 \
            --icon "DemoFlow.app" 160 200 \
            --app-drop-link 420 200 \
            "DemoFlow-${{ github.ref_name }}.dmg" \
            "$dmg_stage_dir"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "DemoFlow-${{ github.ref_name }}.dmg"
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Download the latest release of DemoFlow.

            **Requirements:**
            - macOS 14.0+
            - Apple Silicon

            For dual-channel build notes, see [BUILD_CHANNELS.md](https://github.com/pjcycle/DemoFlow/blob/main/BUILD_CHANNELS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
