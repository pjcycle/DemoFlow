name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project DemoFlow.xcodeproj

      - name: Build Release
        run: |
          xcodebuild archive \
            -project DemoFlow.xcodeproj \
            -scheme DemoFlow \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ${{ github.workspace }}/Build/DemoFlow.xcarchive \
            -derivedDataPath ${{ github.workspace }}/DerivedData \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application: PJ Lee (${{ secrets.APPLE_TEAM_ID }})" \
            INCLUDE_YT_DLP=YES

      - name: Export Archive
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/Build/DemoFlow.xcarchive \
            -exportPath ${{ github.workspace }}/Build/Products \
            -exportOptionsPlist ${{ github.workspace }}/Scripts/ExportOptions.ReleaseDeveloperID.plist

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "DemoFlow" \
            --window-pos 200 200 \
            --window-size 600 400 \
            --icon "DemoFlow.app" 160 200 \
            --app-drop-link 420 200 \
            "DemoFlow-${{ github.ref_name }}.dmg" \
            "${{ github.workspace }}/Build/Products/DemoFlow.app"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "DemoFlow-${{ github.ref_name }}.dmg"
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Download the latest release of DemoFlow.

            **Requirements:**
            - macOS 14.0+
            - Apple Silicon

            For dual-channel build notes, see [BUILD_CHANNELS.md](https://github.com/pjcycle/DemoFlow/blob/main/BUILD_CHANNELS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}