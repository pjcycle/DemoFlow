name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Release
        run: |
          xcodebuild build \
            -project DemoFlow.xcodeproj \
            -scheme DemoFlow \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ${{ github.workspace }}/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            INCLUDE_YT_DLP=YES

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "DemoFlow" \
            --window-pos 200 200 \
            --window-size 600 400 \
            --icon "DemoFlow.app" 160 200 \
            --app-drop-link 420 200 \
            "DemoFlow-${{ github.ref_name }}.dmg" \
            "${{ github.workspace }}/DerivedData/Build/Products/Release/DemoFlow.app"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "DemoFlow-${{ github.ref_name }}.dmg"
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Download the latest release of DemoFlow.

            **Requirements:**
            - macOS 14.0+
            - Apple Silicon

            For dual-channel build notes, see [BUILD_CHANNELS.md](https://github.com/pjcycle/DemoFlow/blob/main/BUILD_CHANNELS.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}